<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SigmoLLM — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-950 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <span class="text-5xl">⚡</span>
      <h1 class="mt-3 text-2xl font-bold text-white">SigmoLLM</h1>
      <p class="text-gray-500 text-sm mt-1">Admin Console</p>
    </div>

    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-8 shadow-2xl">
      {% if error %}
      <div class="mb-4 rounded-lg bg-red-900/40 border border-red-700 px-4 py-3 text-sm text-red-300">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/ui/login" class="space-y-5">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Admin Password</label>
          <input
            type="password"
            name="password"
            autofocus
            required
            placeholder="••••••••"
            class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white px-4 py-2.5 text-sm
                   placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
        </div>
        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700
                 text-white text-sm font-semibold py-2.5 transition-colors">
          Sign in
        </button>
      </form>
    </div>
  </div>
</body>
</html>
